[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whitebear-data-agent"
version = "0.1.0"
description = "A local TextToSQL workspace built with FastAPI and LangGraph."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "httpx",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "openai",
    "psycopg[binary,pool]",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy",
    "sqlglot",
    "tzdata",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
